<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 520" width="100%" height="100%">
  <defs>
    <style>
      .font { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .shadow-sm { filter: drop-shadow(0px 3px 6px rgba(0,0,0,0.06)); }
    </style>
  </defs>

  <rect width="920" height="520" fill="#f8fafc" rx="10" />

  <!-- Page Header -->
  <g transform="translate(35, 25)">
    <text x="0" y="24" fill="#0f172a" font-size="20" font-weight="bold" class="font">Verifikasi Rencana Kegiatan</text>
    <text x="0" y="44" fill="#64748b" font-size="12" class="font">Tinjau proposal kegiatan yang diajukan oleh anggota dan tentukan status persetujuan</text>

    <!-- Status Badge -->
    <rect x="740" y="6" width="145" height="32" rx="16" fill="#e8f0fe" stroke="#bfdbfe" />
    <circle cx="758" cy="22" r="5" fill="#1d4ed8" />
    <text x="815" y="27" fill="#1d4ed8" font-size="12" font-weight="bold" text-anchor="middle" class="font">Status: Diajukan</text>
  </g>

  <!-- Left: Detail Card -->
  <g transform="translate(35, 95)" class="shadow-sm">
    <rect width="530" height="395" rx="8" fill="#ffffff" stroke="#e2e8f0" />
    
    <rect width="530" height="42" rx="8 8 0 0" fill="#001f3f" />
    <text x="20" y="26" fill="#ffffff" font-size="13" font-weight="bold" class="font">📋  Informasi Proposal Kegiatan</text>

    <!-- Info Grid -->
    <g transform="translate(20, 60)">
      <text x="0" y="0" fill="#64748b" font-size="11" font-weight="bold" class="font">NAMA KEGIATAN</text>
      <text x="0" y="18" fill="#0f172a" font-size="14" font-weight="600" class="font">Pelatihan Pembuatan Pupuk Organik Mangrove</text>

      <text x="0" y="55" fill="#64748b" font-size="11" font-weight="bold" class="font">PENANGGUNG JAWAB &amp; PELAKSANA</text>
      <text x="0" y="73" fill="#334155" font-size="12" class="font">Dido Septian (Kelompok Tani Pesisir Berkah)</text>

      <text x="0" y="110" fill="#64748b" font-size="11" font-weight="bold" class="font">WAKTU &amp; LOKASI</text>
      <text x="0" y="128" fill="#334155" font-size="12" class="font">15 - 16 November 2026 • Desa Teluk Bakau (Lat: 0.9123, Lng: 104.5612)</text>

      <text x="0" y="165" fill="#64748b" font-size="11" font-weight="bold" class="font">TOTAL ANGGARAN DIAJUKAN</text>
      <text x="0" y="185" fill="#059669" font-size="16" font-weight="bold" class="font">Rp 6.450.000,- (5 Item Kebutuhan)</text>

      <text x="0" y="220" fill="#64748b" font-size="11" font-weight="bold" class="font">BERKAS TERLAMPIR</text>
      <rect x="0" y="232" width="220" height="28" rx="4" fill="#f1f5f9" />
      <text x="12" y="250" fill="#0369a1" font-size="11" class="font">📄 Proposal_Anggaran_Kegiatan.pdf</text>

      <rect x="230" y="232" width="180" height="28" rx="4" fill="#f1f5f9" />
      <text x="242" y="250" fill="#0369a1" font-size="11" class="font">🖼 Foto_Lokasi_Survei.jpg</text>
    </g>
  </g>

  <!-- Right: Verification Action Panel -->
  <g transform="translate(585, 95)" class="shadow-sm">
    <rect width="300" height="395" rx="8" fill="#ffffff" stroke="#e2e8f0" />
    <rect width="300" height="42" rx="8 8 0 0" fill="#0f172a" />
    <text x="20" y="26" fill="#ffffff" font-size="13" font-weight="bold" class="font">⚡  Aksi Verifikasi Admin</text>

    <g transform="translate(20, 65)">
      <text x="0" y="0" fill="#475569" font-size="11" class="font">Pilih salah satu tindakan evaluasi:</text>

      <!-- Option 1: Setujui -->
      <g transform="translate(0, 15)">
        <rect width="260" height="58" rx="6" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.5" />
        <text x="16" y="24" fill="#065f46" font-size="13" font-weight="bold" class="font">✓  SETUJUI KEGIATAN</text>
        <text x="16" y="42" fill="#047857" font-size="10" class="font">Rencana disetujui &amp; masuk jadwal kalender</text>
      </g>

      <!-- Option 2: Minta Revisi -->
      <g transform="translate(0, 88)">
        <rect width="260" height="98" rx="6" fill="#fffbeb" stroke="#fde68a" stroke-width="1.5" />
        <text x="16" y="24" fill="#92400e" font-size="13" font-weight="bold" class="font">⚠️  MINTA REVISI</text>
        <text x="16" y="40" fill="#b45309" font-size="10" class="font">Catatan hal yang perlu diperbaiki:</text>
        <rect x="14" y="48" width="232" height="36" rx="4" fill="#ffffff" stroke="#cbd5e1" />
        <text x="22" y="70" fill="#64748b" font-size="10" class="font">Mohon perjelas rincian transportasi...</text>
      </g>

      <!-- Option 3: Tolak -->
      <g transform="translate(0, 200)">
        <rect width="260" height="58" rx="6" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5" />
        <text x="16" y="24" fill="#991b1b" font-size="13" font-weight="bold" class="font">✕  TOLAK KEGIATAN</text>
        <text x="16" y="42" fill="#b91c1c" font-size="10" class="font">Tolak proposal jika tidak sesuai agenda</text>
      </g>

      <!-- Action Button Submit -->
      <rect x="0" y="280" width="260" height="38" rx="6" fill="#001f3f" />
      <text x="130" y="304" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle" class="font">Eksekusi Keputusan</text>
    </g>
  </g>
</svg>
