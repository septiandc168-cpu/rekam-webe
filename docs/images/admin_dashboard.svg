<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" height="100%">
  <defs>
    <style>
      .font { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .shadow-sm { filter: drop-shadow(0px 2px 4px rgba(0,0,0,0.05)); }
    </style>
  </defs>

  <!-- Canvas -->
  <rect width="960" height="560" fill="#f4f6f9" rx="10" />

  <!-- SIDEBAR (Navy Blue) -->
  <rect width="210" height="560" fill="#001f3f" rx="10 0 0 10" />
  <rect x="200" width="10" height="560" fill="#001f3f" />
  
  <!-- Brand Logo -->
  <rect x="0" y="0" width="210" height="56" fill="#001933" />
  <circle cx="32" cy="28" r="14" fill="#0ea5e9" />
  <text x="32" y="33" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle" class="font">W</text>
  <text x="56" y="33" fill="#ffffff" font-size="15" font-weight="bold" class="font">Rekam WeBe</text>

  <!-- Sidebar Menu -->
  <!-- Active Dashboard -->
  <rect x="10" y="75" width="190" height="38" rx="6" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.8" stroke-width="0 0 0 3" />
  <text x="25" y="99" fill="#ffffff" font-size="13" font-weight="600" class="font">📊  Dashboard</text>

  <text x="25" y="139" fill="#94a3b8" font-size="13" class="font">👥  Pengguna</text>
  <text x="25" y="179" fill="#94a3b8" font-size="13" class="font">📅  Rencana Kegiatan</text>
  <text x="25" y="219" fill="#94a3b8" font-size="13" class="font">📑  Laporan Kegiatan</text>
  <text x="25" y="259" fill="#94a3b8" font-size="13" class="font">📜  History Realisasi</text>

  <!-- TOP NAVBAR -->
  <rect x="210" y="0" width="750" height="56" fill="#ffffff" class="shadow-sm" />
  <text x="235" y="33" fill="#475569" font-size="16" class="font">☰</text>
  <text x="265" y="33" fill="#0f172a" font-size="15" font-weight="bold" class="font">Dashboard Administrator</text>

  <!-- Navbar Right items -->
  <circle cx="850" cy="28" r="12" fill="#f1f5f9" />
  <text x="850" y="32" fill="#64748b" font-size="12" text-anchor="middle" class="font">🔔</text>
  <circle cx="858" cy="20" r="5" fill="#ef4444" />
  <text x="858" y="23" fill="#ffffff" font-size="7" font-weight="bold" text-anchor="middle" class="font">3</text>

  <rect x="880" y="14" width="65" height="28" rx="14" fill="#001f3f" />
  <text x="912" y="32" fill="#ffffff" font-size="11" font-weight="600" text-anchor="middle" class="font">Admin ▾</text>

  <!-- MAIN CONTENT AREA -->
  <!-- 4 WIDGET CARDS -->
  <!-- Card 1: Diajukan -->
  <g transform="translate(230, 75)" class="shadow-sm">
    <rect width="165" height="85" rx="8" fill="#ffffff" stroke="#e2e8f0" />
    <rect width="4" height="85" rx="8 0 0 8" fill="#3b82f6" />
    <text x="18" y="28" fill="#64748b" font-size="11" font-weight="600" class="font">RENCANA DIAJUKAN</text>
    <text x="18" y="60" fill="#1e293b" font-size="26" font-weight="bold" class="font">5</text>
    <rect x="115" y="25" width="36" height="36" rx="18" fill="#eff6ff" />
    <text x="133" y="48" fill="#3b82f6" font-size="16" text-anchor="middle" class="font">📥</text>
  </g>

  <!-- Card 2: Disetujui -->
  <g transform="translate(410, 75)" class="shadow-sm">
    <rect width="165" height="85" rx="8" fill="#ffffff" stroke="#e2e8f0" />
    <rect width="4" height="85" rx="8 0 0 8" fill="#10b981" />
    <text x="18" y="28" fill="#64748b" font-size="11" font-weight="600" class="font">RENCANA DISETUJUI</text>
    <text x="18" y="60" fill="#1e293b" font-size="26" font-weight="bold" class="font">14</text>
    <rect x="115" y="25" width="36" height="36" rx="18" fill="#ecfdf5" />
    <text x="133" y="48" fill="#10b981" font-size="16" text-anchor="middle" class="font">✓</text>
  </g>

  <!-- Card 3: Laporan Masuk -->
  <g transform="translate(590, 75)" class="shadow-sm">
    <rect width="165" height="85" rx="8" fill="#ffffff" stroke="#e2e8f0" />
    <rect width="4" height="85" rx="8 0 0 8" fill="#f59e0b" />
    <text x="18" y="28" fill="#64748b" font-size="11" font-weight="600" class="font">LAPORAN AKTIF</text>
    <text x="18" y="60" fill="#1e293b" font-size="26" font-weight="bold" class="font">4</text>
    <rect x="115" y="25" width="36" height="36" rx="18" fill="#fffbeb" />
    <text x="133" y="48" fill="#f59e0b" font-size="16" text-anchor="middle" class="font">📑</text>
  </g>

  <!-- Card 4: Total Anggota -->
  <g transform="translate(770, 75)" class="shadow-sm">
    <rect width="165" height="85" rx="8" fill="#ffffff" stroke="#e2e8f0" />
    <rect width="4" height="85" rx="8 0 0 8" fill="#8b5cf6" />
    <text x="18" y="28" fill="#64748b" font-size="11" font-weight="600" class="font">TOTAL ANGGOTA</text>
    <text x="18" y="60" fill="#1e293b" font-size="26" font-weight="bold" class="font">18</text>
    <rect x="115" y="25" width="36" height="36" rx="18" fill="#f5f3ff" />
    <text x="133" y="48" fill="#8b5cf6" font-size="16" text-anchor="middle" class="font">👥</text>
  </g>

  <!-- LOWER SECTION: Grafik & Peta -->
  <!-- Grafik Kegiatan Bulanan -->
  <g transform="translate(230, 180)" class="shadow-sm">
    <rect width="420" height="355" rx="8" fill="#ffffff" stroke="#e2e8f0" />
    <text x="20" y="32" fill="#0f172a" font-size="14" font-weight="bold" class="font">Statistik Tren Kegiatan (Bulanan)</text>
    <text x="20" y="48" fill="#94a3b8" font-size="11" class="font">Perbandingan rencana disetujui vs selesai terealisasi</text>

    <!-- Legend -->
    <circle cx="280" cy="30" r="5" fill="#001f3f" />
    <text x="292" y="34" fill="#64748b" font-size="11" class="font">Disetujui</text>
    <circle cx="360" cy="30" r="5" fill="#10b981" />
    <text x="372" y="34" fill="#64748b" font-size="11" class="font">Selesai</text>

    <!-- Bar Chart Simulation -->
    <line x1="40" y1="280" x2="390" y2="280" stroke="#cbd5e1" stroke-width="1" />
    <line x1="40" y1="220" x2="390" y2="220" stroke="#f1f5f9" stroke-width="1" stroke-dasharray="3,3" />
    <line x1="40" y1="160" x2="390" y2="160" stroke="#f1f5f9" stroke-width="1" stroke-dasharray="3,3" />
    <line x1="40" y1="100" x2="390" y2="100" stroke="#f1f5f9" stroke-width="1" stroke-dasharray="3,3" />

    <!-- Bars -->
    <!-- Jan -->
    <rect x="65" y="190" width="14" height="90" fill="#001f3f" rx="2" />
    <rect x="82" y="210" width="14" height="70" fill="#10b981" rx="2" />
    <text x="80" y="300" fill="#64748b" font-size="11" text-anchor="middle" class="font">Jan</text>

    <!-- Feb -->
    <rect x="130" y="150" width="14" height="130" fill="#001f3f" rx="2" />
    <rect x="147" y="170" width="14" height="110" fill="#10b981" rx="2" />
    <text x="145" y="300" fill="#64748b" font-size="11" text-anchor="middle" class="font">Feb</text>

    <!-- Mar -->
    <rect x="195" y="110" width="14" height="170" fill="#001f3f" rx="2" />
    <rect x="212" y="140" width="14" height="140" fill="#10b981" rx="2" />
    <text x="210" y="300" fill="#64748b" font-size="11" text-anchor="middle" class="font">Mar</text>

    <!-- Apr -->
    <rect x="260" y="130" width="14" height="150" fill="#001f3f" rx="2" />
    <rect x="277" y="160" width="14" height="120" fill="#10b981" rx="2" />
    <text x="275" y="300" fill="#64748b" font-size="11" text-anchor="middle" class="font">Apr</text>

    <!-- Mei -->
    <rect x="325" y="170" width="14" height="110" fill="#001f3f" rx="2" />
    <rect x="342" y="220" width="14" height="60" fill="#10b981" rx="2" />
    <text x="340" y="300" fill="#64748b" font-size="11" text-anchor="middle" class="font">Mei</text>
  </g>

  <!-- Peta Sebaran Lokasi Kegiatan -->
  <g transform="translate(670, 180)" class="shadow-sm">
    <rect width="265" height="355" rx="8" fill="#ffffff" stroke="#e2e8f0" />
    <text x="18" y="32" fill="#0f172a" font-size="14" font-weight="bold" class="font">Peta Sebaran Kegiatan</text>
    <text x="18" y="48" fill="#94a3b8" font-size="11" class="font">Titik koordinat kegiatan disetujui</text>

    <!-- Map Canvas Placeholder -->
    <rect x="18" y="65" width="229" height="268" rx="6" fill="#e0f2fe" />
    <!-- Map road lines -->
    <path d="M 20 180 Q 90 120 160 210 T 247 160" stroke="#bae6fd" stroke-width="12" fill="none" />
    <path d="M 80 70 Q 120 150 110 320" stroke="#bae6fd" stroke-width="8" fill="none" />

    <!-- Markers -->
    <g transform="translate(90, 140)">
      <circle cx="0" cy="0" r="14" fill="#001f3f" fill-opacity="0.2" />
      <circle cx="0" cy="0" r="7" fill="#ef4444" />
      <circle cx="0" cy="0" r="3" fill="#ffffff" />
    </g>
    <g transform="translate(160, 200)">
      <circle cx="0" cy="0" r="14" fill="#001f3f" fill-opacity="0.2" />
      <circle cx="0" cy="0" r="7" fill="#10b981" />
      <circle cx="0" cy="0" r="3" fill="#ffffff" />
    </g>
    <g transform="translate(130, 95)">
      <circle cx="0" cy="0" r="14" fill="#001f3f" fill-opacity="0.2" />
      <circle cx="0" cy="0" r="7" fill="#3b82f6" />
      <circle cx="0" cy="0" r="3" fill="#ffffff" />
    </g>
  </g>
</svg>
