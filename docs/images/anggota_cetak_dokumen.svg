<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 480" width="100%" height="100%">
  <defs>
    <style>
      .font { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .shadow-sm { filter: drop-shadow(0px 3px 6px rgba(0,0,0,0.06)); }
    </style>
  </defs>

  <rect width="920" height="480" fill="#f8fafc" rx="10" />

  <!-- Page Header -->
  <g transform="translate(35, 20)">
    <text x="0" y="24" fill="#0f172a" font-size="20" font-weight="bold" class="font">Cetak &amp; Unduh Dokumen Resmi</text>
    <text x="0" y="44" fill="#64748b" font-size="12" class="font">Format cetak ramah printer browser dan dokumen PDF terstandar Yayasan WeBe</text>
  </g>

  <!-- Left: Unduh PDF Rencana -->
  <g transform="translate(35, 80)" class="shadow-sm">
    <rect width="405" height="370" rx="8" fill="#ffffff" stroke="#e2e8f0" />
    <rect width="405" height="40" rx="8 8 0 0" fill="#001f3f" />
    <text x="20" y="25" fill="#ffffff" font-size="13" font-weight="bold" class="font">📄  Dokumen PDF Rencana Kegiatan</text>

    <!-- Mini Paper Simulation -->
    <g transform="translate(35, 55)">
      <rect width="335" height="235" rx="4" fill="#ffffff" stroke="#cbd5e1" class="shadow-sm" />
      
      <!-- Kop Surat -->
      <line x1="20" y1="45" x2="315" y2="45" stroke="#001f3f" stroke-width="2" />
      <text x="167" y="25" fill="#001f3f" font-size="11" font-weight="bold" text-anchor="middle" class="font">YAYASAN WEBE MARITIM</text>
      <text x="167" y="38" fill="#64748b" font-size="8" text-anchor="middle" class="font">FORMULIR PENGAJUAN RENCANA KEGIATAN</text>

      <!-- Lines -->
      <rect x="25" y="60" width="140" height="8" rx="2" fill="#94a3b8" />
      <rect x="25" y="75" width="280" height="6" rx="2" fill="#cbd5e1" />
      <rect x="25" y="88" width="260" height="6" rx="2" fill="#cbd5e1" />
      
      <!-- Table simulation -->
      <rect x="25" y="105" width="285" height="50" rx="2" fill="#f8fafc" stroke="#e2e8f0" />
      <line x1="25" y1="120" x2="310" y2="120" stroke="#cbd5e1" />
      <rect x="35" y="110" width="80" height="5" rx="1" fill="#64748b" />
      <rect x="35" y="130" width="120" height="5" rx="1" fill="#94a3b8" />
      <rect x="35" y="142" width="100" height="5" rx="1" fill="#94a3b8" />

      <!-- Signature -->
      <text x="250" y="195" fill="#64748b" font-size="8" class="font">Penanggung Jawab,</text>
      <line x1="230" y1="215" x2="300" y2="215" stroke="#94a3b8" />
    </g>

    <!-- Download Button -->
    <rect x="35" y="310" width="335" height="38" rx="6" fill="#0284c7" />
    <text x="202" y="334" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle" class="font">📥 Unduh PDF Rencana (.pdf)</text>
  </g>

  <!-- Right: Cetak Laporan (Print View) -->
  <g transform="translate(480, 80)" class="shadow-sm">
    <rect width="405" height="370" rx="8" fill="#ffffff" stroke="#e2e8f0" />
    <rect width="405" height="40" rx="8 8 0 0" fill="#001f3f" />
    <text x="20" y="25" fill="#ffffff" font-size="13" font-weight="bold" class="font">🖨️  Cetak Laporan Realisasi (Print View)</text>

    <!-- Mini Paper Simulation -->
    <g transform="translate(35, 55)">
      <rect width="335" height="235" rx="4" fill="#ffffff" stroke="#cbd5e1" class="shadow-sm" />

      <!-- Kop Surat -->
      <line x1="20" y1="45" x2="315" y2="45" stroke="#001f3f" stroke-width="2" />
      <text x="167" y="25" fill="#001f3f" font-size="11" font-weight="bold" text-anchor="middle" class="font">YAYASAN WEBE MARITIM</text>
      <text x="167" y="38" fill="#64748b" font-size="8" text-anchor="middle" class="font">LAPORAN PERTANGGUNGJAWABAN KEGIATAN</text>

      <!-- Summary -->
      <rect x="25" y="60" width="160" height="8" rx="2" fill="#059669" />
      <rect x="25" y="75" width="280" height="6" rx="2" fill="#cbd5e1" />
      <rect x="25" y="88" width="270" height="6" rx="2" fill="#cbd5e1" />

      <!-- Mini Photos Grid -->
      <rect x="25" y="105" width="85" height="60" rx="2" fill="#e2e8f0" />
      <text x="67" y="138" font-size="14" text-anchor="middle">📷</text>

      <rect x="120" y="105" width="85" height="60" rx="2" fill="#e2e8f0" />
      <text x="162" y="138" font-size="14" text-anchor="middle">📋</text>

      <rect x="215" y="105" width="85" height="60" rx="2" fill="#e2e8f0" />
      <text x="257" y="138" font-size="14" text-anchor="middle">📜</text>

      <!-- Signature -->
      <text x="245" y="195" fill="#64748b" font-size="8" class="font">Pelaksana Kegiatan,</text>
      <line x1="230" y1="215" x2="300" y2="215" stroke="#94a3b8" />
    </g>

    <!-- Print Button -->
    <rect x="35" y="310" width="335" height="38" rx="6" fill="#10b981" />
    <text x="202" y="334" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle" class="font">🖨️ Buka Tampilan Cetak (Print)</text>
  </g>
</svg>
