<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="100%">
  <defs>
    <style>
      .font { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .shadow { filter: drop-shadow(0px 8px 16px rgba(0,0,0,0.08)); }
    </style>
  </defs>

  <rect width="900" height="480" fill="#f8fafc" rx="12" />

  <!-- Top bar -->
  <rect width="900" height="42" fill="#0f172a" rx="12 12 0 0" />
  <circle cx="24" cy="21" r="6" fill="#ef4444" />
  <circle cx="44" cy="21" r="6" fill="#eab308" />
  <circle cx="64" cy="21" r="6" fill="#22c55e" />
  <text x="450" y="26" fill="#94a3b8" font-size="11" text-anchor="middle" class="font">Panduan Login Awal &amp; Ganti Password Anggota</text>

  <!-- Step 1: Login Default -->
  <g transform="translate(45, 75)" class="shadow">
    <rect width="375" height="365" rx="10" fill="#ffffff" stroke="#e2e8f0" />
    <rect width="375" height="52" rx="10 10 0 0" fill="#001f3f" />
    <text x="25" y="32" fill="#ffffff" font-size="15" font-weight="bold" class="font">Langkah 1: Login Akun Anggota</text>

    <!-- Content -->
    <g transform="translate(25, 75)">
      <text x="0" y="15" fill="#475569" font-size="12" font-weight="600" class="font">Email Anda (terdaftar oleh Admin)</text>
      <rect x="0" y="25" width="325" height="36" rx="6" fill="#ffffff" stroke="#cbd5e1" />
      <text x="12" y="48" fill="#1e293b" font-size="13" class="font">nama.anggota@yayasanwebe.org</text>

      <text x="0" y="90" fill="#475569" font-size="12" font-weight="600" class="font">Password Pertama Kali (Default)</text>
      <rect x="0" y="100" width="325" height="36" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5" />
      <text x="12" y="123" fill="#92400e" font-size="14" font-weight="bold" class="font">12345678</text>

      <!-- Badge Info -->
      <rect x="0" y="155" width="325" height="42" rx="6" fill="#eff6ff" />
      <text x="12" y="172" fill="#1e40af" font-size="11" font-weight="600" class="font">💡 Password default awal adalah 12345678</text>
      <text x="12" y="188" fill="#3b82f6" font-size="10" class="font">Diberikan oleh Admin saat pendaftaran akun.</text>

      <rect x="0" y="215" width="325" height="40" rx="6" fill="#001f3f" />
      <text x="162" y="240" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle" class="font">Klik Masuk / Login</text>
    </g>
  </g>

  <!-- Arrow -->
  <g transform="translate(432, 230)">
    <circle cx="18" cy="18" r="18" fill="#001f3f" />
    <path d="M14 10 L22 18 L14 26" stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round" />
  </g>

  <!-- Step 2: Ubah Password -->
  <g transform="translate(480, 75)" class="shadow">
    <rect width="375" height="365" rx="10" fill="#ffffff" stroke="#e2e8f0" />
    <rect width="375" height="52" rx="10 10 0 0" fill="#001f3f" />
    <text x="25" y="32" fill="#ffffff" font-size="15" font-weight="bold" class="font">Langkah 2: Ganti Password Pribadi</text>

    <g transform="translate(25, 75)">
      <text x="0" y="10" fill="#475569" font-size="11" class="font">Ketik sandi saat ini:</text>
      <rect x="0" y="18" width="325" height="32" rx="6" fill="#ffffff" stroke="#cbd5e1" />
      <text x="12" y="39" fill="#64748b" font-size="13" class="font">12345678</text>

      <text x="0" y="75" fill="#475569" font-size="11" class="font">Password Baru (min. 8 karakter):</text>
      <rect x="0" y="83" width="325" height="32" rx="6" fill="#ffffff" stroke="#cbd5e1" />
      <text x="12" y="104" fill="#64748b" font-size="15" class="font">••••••••••••</text>

      <text x="0" y="140" fill="#475569" font-size="11" class="font">Konfirmasi Password Baru:</text>
      <rect x="0" y="148" width="325" height="32" rx="6" fill="#ffffff" stroke="#cbd5e1" />
      <text x="12" y="169" fill="#64748b" font-size="15" class="font">••••••••••••</text>

      <!-- Button Save -->
      <rect x="0" y="200" width="325" height="38" rx="6" fill="#10b981" />
      <text x="162" y="224" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle" class="font">✓ Simpan Password Baru</text>

      <rect x="0" y="250" width="325" height="1" fill="#e2e8f0" />
      <text x="162" y="270" fill="#64748b" font-size="11" text-anchor="middle" class="font">Akses dari menu profil pojok kanan atas nama Anda</text>
    </g>
  </g>
</svg>
