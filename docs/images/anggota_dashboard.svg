<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <style>
      .font { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .shadow-sm { filter: drop-shadow(0px 2px 4px rgba(0,0,0,0.05)); }
    </style>
  </defs>

  <rect width="960" height="540" fill="#f4f6f9" rx="10" />

  <!-- SIDEBAR (Navy Blue) -->
  <rect width="210" height="540" fill="#001f3f" rx="10 0 0 10" />
  <rect x="200" width="10" height="540" fill="#001f3f" />

  <!-- Logo Brand -->
  <rect x="0" y="0" width="210" height="56" fill="#001933" />
  <circle cx="32" cy="28" r="14" fill="#0ea5e9" />
  <text x="32" y="33" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle" class="font">W</text>
  <text x="56" y="33" fill="#ffffff" font-size="15" font-weight="bold" class="font">Rekam WeBe</text>

  <!-- Sidebar Menu (Khusus Anggota: Tanpa Menu Pengguna) -->
  <rect x="10" y="75" width="190" height="38" rx="6" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.8" stroke-width="0 0 0 3" />
  <text x="25" y="99" fill="#ffffff" font-size="13" font-weight="600" class="font">📊  Dashboard</text>

  <text x="25" y="145" fill="#94a3b8" font-size="13" class="font">📅  Rencana Kegiatan</text>
  <text x="25" y="195" fill="#94a3b8" font-size="13" class="font">📑  Laporan Kegiatan</text>
  <text x="25" y="245" fill="#94a3b8" font-size="13" class="font">📜  History Realisasi</text>

  <!-- TOP NAVBAR -->
  <rect x="210" y="0" width="750" height="56" fill="#ffffff" class="shadow-sm" />
  <text x="235" y="33" fill="#475569" font-size="16" class="font">☰</text>
  <text x="265" y="33" fill="#0f172a" font-size="15" font-weight="bold" class="font">Dashboard Anggota Lapangan</text>

  <!-- Right items -->
  <circle cx="830" cy="28" r="12" fill="#f1f5f9" />
  <text x="830" y="32" fill="#64748b" font-size="12" text-anchor="middle" class="font">🔔</text>
  <rect x="860" y="14" width="85" height="28" rx="14" fill="#001f3f" />
  <text x="902" y="32" fill="#ffffff" font-size="11" font-weight="600" text-anchor="middle" class="font">Dido S. ▾</text>

  <!-- 3 WIDGET CARDS ANGGOTA -->
  <!-- Card 1 -->
  <g transform="translate(230, 75)" class="shadow-sm">
    <rect width="225" height="85" rx="8" fill="#ffffff" stroke="#e2e8f0" />
    <rect width="4" height="85" rx="8 0 0 8" fill="#3b82f6" />
    <text x="18" y="28" fill="#64748b" font-size="11" font-weight="600" class="font">RENCANA MILIK SAYA</text>
    <text x="18" y="60" fill="#1e293b" font-size="26" font-weight="bold" class="font">3</text>
    <text x="50" y="58" fill="#64748b" font-size="11" class="font">Draft / Berjalan</text>
    <rect x="175" y="25" width="36" height="36" rx="18" fill="#eff6ff" />
    <text x="193" y="48" fill="#3b82f6" font-size="16" text-anchor="middle" class="font">📝</text>
  </g>

  <!-- Card 2 -->
  <g transform="translate(480, 75)" class="shadow-sm">
    <rect width="225" height="85" rx="8" fill="#ffffff" stroke="#e2e8f0" />
    <rect width="4" height="85" rx="8 0 0 8" fill="#10b981" />
    <text x="18" y="28" fill="#64748b" font-size="11" font-weight="600" class="font">RENCANA DISETUJUI</text>
    <text x="18" y="60" fill="#1e293b" font-size="26" font-weight="bold" class="font">2</text>
    <text x="50" y="58" fill="#10b981" font-size="11" class="font">Siap dilaksanakan</text>
    <rect x="175" y="25" width="36" height="36" rx="18" fill="#ecfdf5" />
    <text x="193" y="48" fill="#10b981" font-size="16" text-anchor="middle" class="font">✓</text>
  </g>

  <!-- Card 3 -->
  <g transform="translate(730, 75)" class="shadow-sm">
    <rect width="205" height="85" rx="8" fill="#ffffff" stroke="#e2e8f0" />
    <rect width="4" height="85" rx="8 0 0 8" fill="#f59e0b" />
    <text x="18" y="28" fill="#64748b" font-size="11" font-weight="600" class="font">LAPORAN PROSES</text>
    <text x="18" y="60" fill="#1e293b" font-size="26" font-weight="bold" class="font">1</text>
    <text x="45" y="58" fill="#f59e0b" font-size="11" class="font">Menunggu admin</text>
    <rect x="155" y="25" width="36" height="36" rx="18" fill="#fffbeb" />
    <text x="173" y="48" fill="#f59e0b" font-size="16" text-anchor="middle" class="font">⏳</text>
  </g>

  <!-- KALENDER AGENDA & PETA ANGGOTA -->
  <g transform="translate(230, 180)" class="shadow-sm">
    <rect width="420" height="330" rx="8" fill="#ffffff" stroke="#e2e8f0" />
    <text x="20" y="32" fill="#0f172a" font-size="14" font-weight="bold" class="font">Kalender Kegiatan Anda (Disetujui)</text>
    <text x="20" y="48" fill="#94a3b8" font-size="11" class="font">Jadwal pelaksanaan kegiatan yang telah disahkan oleh Admin</text>

    <!-- Calendar Simulation -->
    <rect x="20" y="65" width="380" height="240" rx="6" fill="#f8fafc" stroke="#e2e8f0" />
    <!-- Days header -->
    <text x="45" y="88" fill="#64748b" font-size="11" font-weight="bold" class="font">SEN</text>
    <text x="100" y="88" fill="#64748b" font-size="11" font-weight="bold" class="font">SEL</text>
    <text x="155" y="88" fill="#64748b" font-size="11" font-weight="bold" class="font">RAB</text>
    <text x="210" y="88" fill="#64748b" font-size="11" font-weight="bold" class="font">KAM</text>
    <text x="265" y="88" fill="#64748b" font-size="11" font-weight="bold" class="font">JUM</text>
    <text x="320" y="88" fill="#64748b" font-size="11" font-weight="bold" class="font">SAB</text>
    <text x="365" y="88" fill="#ef4444" font-size="11" font-weight="bold" class="font">MIN</text>

    <!-- Event tag -->
    <rect x="140" y="140" width="165" height="36" rx="4" fill="#001f3f" />
    <text x="150" y="156" fill="#ffffff" font-size="10" font-weight="bold" class="font">Pelatihan Pupuk Mangrove</text>
    <text x="150" y="168" fill="#93c5fd" font-size="9" class="font">15 - 16 Nov • Disetujui</text>
  </g>

  <!-- Peta Lokasi Kegiatan Sendiri -->
  <g transform="translate(670, 180)" class="shadow-sm">
    <rect width="265" height="330" rx="8" fill="#ffffff" stroke="#e2e8f0" />
    <text x="18" y="32" fill="#0f172a" font-size="14" font-weight="bold" class="font">Peta Lokasi Kegiatan Anda</text>
    <text x="18" y="48" fill="#94a3b8" font-size="11" class="font">Titik pin kegiatan lapangan Anda</text>

    <!-- Map Canvas -->
    <rect x="18" y="65" width="229" height="245" rx="6" fill="#e0f2fe" />
    <path d="M 20 180 Q 90 120 160 210 T 247 160" stroke="#bae6fd" stroke-width="12" fill="none" />
    <g transform="translate(130, 150)">
      <circle cx="0" cy="0" r="16" fill="#001f3f" fill-opacity="0.25" />
      <circle cx="0" cy="0" r="8" fill="#10b981" />
      <circle cx="0" cy="0" r="3" fill="#ffffff" />
      <!-- Tooltip -->
      <rect x="-65" y="-36" width="130" height="24" rx="4" fill="#001f3f" />
      <text x="0" y="-20" fill="#ffffff" font-size="9" text-anchor="middle" class="font">Desa Teluk Bakau</text>
    </g>
  </g>
</svg>
