<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 480" width="100%" height="100%">
  <defs>
    <style>
      .font { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .shadow-sm { filter: drop-shadow(0px 3px 6px rgba(0,0,0,0.06)); }
    </style>
  </defs>

  <rect width="920" height="480" fill="#f8fafc" rx="10" />

  <!-- Page Header -->
  <g transform="translate(35, 20)">
    <text x="0" y="24" fill="#0f172a" font-size="20" font-weight="bold" class="font">Siklus Status &amp; Tindak Lanjut Revisi</text>
    <text x="0" y="44" fill="#64748b" font-size="12" class="font">Pahami arti setiap status dan cara memperbaiki kegiatan yang diminta revisi oleh Admin</text>
  </g>

  <!-- Status Lifecycle Bar -->
  <g transform="translate(35, 80)" class="shadow-sm">
    <rect width="850" height="70" rx="8" fill="#ffffff" stroke="#e2e8f0" />
    
    <!-- 1. Draft -->
    <g transform="translate(30, 20)">
      <rect width="90" height="30" rx="15" fill="#f1f5f9" />
      <text x="45" y="20" fill="#475569" font-size="12" font-weight="bold" text-anchor="middle" class="font">Draft</text>
    </g>

    <text x="140" y="40" fill="#94a3b8" font-size="16" class="font">➔</text>

    <!-- 2. Diajukan -->
    <g transform="translate(175, 20)">
      <rect width="100" height="30" rx="15" fill="#e0f2fe" />
      <text x="50" y="20" fill="#0284c7" font-size="12" font-weight="bold" text-anchor="middle" class="font">Diajukan</text>
    </g>

    <text x="295" y="40" fill="#94a3b8" font-size="16" class="font">➔</text>

    <!-- 3. Disetujui (Success) -->
    <g transform="translate(330, 20)">
      <rect width="110" height="30" rx="15" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5" />
      <text x="55" y="20" fill="#065f46" font-size="12" font-weight="bold" text-anchor="middle" class="font">✓ Disetujui</text>
    </g>

    <text x="460" y="40" fill="#94a3b8" font-size="14" class="font">atau</text>

    <!-- 4. Revisi (Warning) -->
    <g transform="translate(505, 20)">
      <rect width="100" height="30" rx="15" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5" />
      <text x="50" y="20" fill="#b45309" font-size="12" font-weight="bold" text-anchor="middle" class="font">⚠️ Revisi</text>
    </g>

    <text x="625" y="40" fill="#94a3b8" font-size="14" class="font">atau</text>

    <!-- 5. Ditolak (Danger) -->
    <g transform="translate(670, 20)">
      <rect width="100" height="30" rx="15" fill="#fee2e2" />
      <text x="50" y="20" fill="#b91c1c" font-size="12" font-weight="bold" text-anchor="middle" class="font">✕ Ditolak</text>
    </g>
  </g>

  <!-- Revision Handling Card -->
  <g transform="translate(35, 175)" class="shadow-sm">
    <rect width="850" height="275" rx="8" fill="#ffffff" stroke="#e2e8f0" />
    <rect width="850" height="40" rx="8 8 0 0" fill="#fffbeb" stroke="#fde68a" stroke-width="1" />
    <text x="25" y="25" fill="#92400e" font-size="13" font-weight="bold" class="font">⚠️  Tampilan Saat Rencana Memerlukan Revisi</text>

    <!-- Content -->
    <g transform="translate(25, 60)">
      <!-- Catatan Admin Box -->
      <rect width="800" height="50" rx="6" fill="#fef3c7" stroke="#fde68a" />
      <text x="18" y="22" fill="#92400e" font-size="11" font-weight="bold" class="font">CATATAN REVISI DARI ADMIN:</text>
      <text x="18" y="38" fill="#78350f" font-size="12" class="font">"Mohon lampirkan berkas proposal anggaran bertanda tangan dan lengkapi deskripsi tujuan."</text>

      <!-- Checklist Missing Fields -->
      <g transform="translate(0, 70)">
        <text x="0" y="0" fill="#475569" font-size="12" font-weight="bold" class="font">Daftar Data Wajib yang Belum Lengkap (Indikator Sistem):</text>
        <g transform="translate(0, 15)">
          <rect x="0" y="0" width="220" height="26" rx="4" fill="#fee2e2" />
          <text x="10" y="17" fill="#b91c1c" font-size="11" class="font">❌ File Anggaran Kegiatan</text>

          <rect x="235" y="0" width="200" height="26" rx="4" fill="#fee2e2" />
          <text x="245" y="17" fill="#b91c1c" font-size="11" class="font">❌ Titik Koordinat (Peta)</text>
        </g>
      </g>

      <!-- Action Button Edit & Submit -->
      <g transform="translate(0, 140)">
        <rect width="210" height="38" rx="6" fill="#001f3f" />
        <text x="105" y="24" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle" class="font">✎ Edit Rencana Kegiatan</text>

        <rect x="225" y="0" width="210" height="38" rx="6" fill="#10b981" />
        <text x="330" y="24" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle" class="font">🚀 Ajukan Ulang ke Admin</text>
      </g>
    </g>
  </g>
</svg>
