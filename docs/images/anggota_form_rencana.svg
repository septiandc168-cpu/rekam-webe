<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 550" width="100%" height="100%">
  <defs>
    <style>
      .font { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .shadow-sm { filter: drop-shadow(0px 3px 6px rgba(0,0,0,0.06)); }
    </style>
  </defs>

  <rect width="940" height="550" fill="#f8fafc" rx="10" />

  <!-- Page Header -->
  <g transform="translate(35, 20)">
    <text x="0" y="24" fill="#0f172a" font-size="20" font-weight="bold" class="font">Formulir Pembuatan Rencana Kegiatan</text>
    <text x="0" y="44" fill="#64748b" font-size="12" class="font">Lengkapi 3 langkah wizard di bawah ini untuk mengajukan kegiatan baru ke Admin</text>
  </g>

  <!-- WIZARD STEP INDICATOR (3 STEPS) -->
  <g transform="translate(100, 75)">
    <!-- Connecting Line -->
    <line x1="80" y1="20" x2="660" y2="20" stroke="#cbd5e1" stroke-width="3" />
    <line x1="80" y1="20" x2="370" y2="20" stroke="#001f3f" stroke-width="3" />

    <!-- Step 1 (Done) -->
    <circle cx="80" cy="20" r="18" fill="#001f3f" />
    <text x="80" y="25" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle" class="font">1</text>
    <text x="80" y="52" fill="#001f3f" font-size="12" font-weight="bold" text-anchor="middle" class="font">Detail Kegiatan</text>

    <!-- Step 2 (Active) -->
    <circle cx="370" cy="20" r="18" fill="#001f3f" />
    <text x="370" y="25" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle" class="font">2</text>
    <text x="370" y="52" fill="#001f3f" font-size="12" font-weight="bold" text-anchor="middle" class="font">Waktu &amp; Lokasi (Peta)</text>

    <!-- Step 3 (Next) -->
    <circle cx="660" cy="20" r="18" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="2" />
    <text x="660" y="25" fill="#64748b" font-size="12" font-weight="bold" text-anchor="middle" class="font">3</text>
    <text x="660" y="52" fill="#64748b" font-size="12" text-anchor="middle" class="font">Dokumen &amp; Anggaran</text>
  </g>

  <!-- FORM CARD (SHOWCASE STEP 2 & 3) -->
  <g transform="translate(35, 150)" class="shadow-sm">
    <rect width="870" height="375" rx="8" fill="#ffffff" stroke="#e2e8f0" />
    
    <!-- Left Column: Input Waktu & Peta Pin Picker -->
    <g transform="translate(25, 20)">
      <text x="0" y="16" fill="#0f172a" font-size="14" font-weight="bold" class="font">📍  Waktu Pelaksanaan &amp; Pin Peta (Step 2)</text>
      
      <!-- Tanggal & Waktu -->
      <g transform="translate(0, 30)">
        <text x="0" y="0" fill="#475569" font-size="11" class="font">Tanggal Pelaksanaan:</text>
        <rect x="0" y="8" width="180" height="30" rx="4" fill="#ffffff" stroke="#cbd5e1" />
        <text x="10" y="28" fill="#1e293b" font-size="11" class="font">15/11/2026 - 16/11/2026</text>

        <text x="195" y="0" fill="#475569" font-size="11" class="font">Desa / Wilayah:</text>
        <rect x="195" y="8" width="185" height="30" rx="4" fill="#ffffff" stroke="#cbd5e1" />
        <text x="205" y="28" fill="#1e293b" font-size="11" class="font">Desa Teluk Bakau</text>
      </g>

      <!-- Peta Leaflet Pin Picker Simulator -->
      <g transform="translate(0, 85)">
        <text x="0" y="0" fill="#475569" font-size="11" class="font">Pilih Titik Lokasi Pada Peta (Klik untuk pasang Pin):</text>
        <rect x="0" y="10" width="380" height="170" rx="6" fill="#e0f2fe" stroke="#bae6fd" />
        <!-- Map lines -->
        <path d="M 0 100 Q 120 40 220 130 T 380 90" stroke="#bae6fd" stroke-width="12" fill="none" />
        <path d="M 160 10 Q 200 90 190 180" stroke="#bae6fd" stroke-width="8" fill="none" />

        <!-- Pin Leaflet Marker -->
        <g transform="translate(190, 85)">
          <ellipse cx="0" cy="18" rx="10" ry="4" fill="#000000" fill-opacity="0.2" />
          <path d="M 0 0 C -12 -14 -12 -30 0 -30 C 12 -30 12 -14 0 0 Z" fill="#ef4444" />
          <circle cx="0" cy="-18" r="5" fill="#ffffff" />
        </g>

        <!-- Coordinates Callout Box -->
        <rect x="10" y="140" width="360" height="30" rx="4" fill="#001f3f" fill-opacity="0.9" />
        <text x="20" y="160" fill="#ffffff" font-size="10" class="font">🎯 Koordinat Terpilih: Lat: 0.912345, Lng: 104.561234</text>
      </g>
    </g>

    <!-- Vertical separator line -->
    <line x1="440" y1="20" x2="440" y2="350" stroke="#f1f5f9" stroke-width="2" />

    <!-- Right Column: Rincian Anggaran & Tombol Aksi (Step 3) -->
    <g transform="translate(460, 20)">
      <text x="0" y="16" fill="#0f172a" font-size="14" font-weight="bold" class="font">💰  Rincian Anggaran &amp; Pengajuan (Step 3)</text>

      <!-- Mini Table Anggaran -->
      <g transform="translate(0, 35)">
        <rect width="380" height="150" rx="6" fill="#f8fafc" stroke="#e2e8f0" />
        <rect width="380" height="26" rx="6 6 0 0" fill="#001f3f" />
        <text x="12" y="18" fill="#ffffff" font-size="10" font-weight="bold" class="font">URAIAN</text>
        <text x="180" y="18" fill="#ffffff" font-size="10" font-weight="bold" class="font">VOL / SAT</text>
        <text x="280" y="18" fill="#ffffff" font-size="10" font-weight="bold" class="font">SUBTOTAL (RP)</text>

        <!-- Row 1 -->
        <text x="12" y="46" fill="#334155" font-size="10" class="font">Konsumsi Peserta Pelatihan</text>
        <text x="180" y="46" fill="#334155" font-size="10" class="font">30 Paket</text>
        <text x="280" y="46" fill="#334155" font-size="10" class="font">Rp 1.500.000</text>

        <!-- Row 2 -->
        <text x="12" y="72" fill="#334155" font-size="10" class="font">Bahan Baku &amp; EM4</text>
        <text x="180" y="72" fill="#334155" font-size="10" class="font">5 Botol</text>
        <text x="280" y="72" fill="#334155" font-size="10" class="font">Rp 750.000</text>

        <!-- Total bar -->
        <rect y="118" width="380" height="32" rx="0 0 6 6" fill="#e2e8f0" />
        <text x="12" y="139" fill="#0f172a" font-size="11" font-weight="bold" class="font">Total Estimasi:</text>
        <text x="280" y="139" fill="#059669" font-size="12" font-weight="bold" class="font">Rp 2.250.000</text>
      </g>

      <!-- Tombol Aksi Simpan -->
      <g transform="translate(0, 215)">
        <text x="0" y="0" fill="#475569" font-size="11" class="font">Pilihan Pengiriman Form:</text>

        <!-- Button Draft -->
        <rect x="0" y="12" width="175" height="42" rx="6" fill="#64748b" />
        <text x="87" y="37" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle" class="font">💾  Simpan Sebagai Draft</text>

        <!-- Button Ajukan -->
        <rect x="185" y="12" width="195" height="42" rx="6" fill="#001f3f" />
        <text x="282" y="37" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle" class="font">🚀  Ajukan Rencana Kegiatan</text>

        <text x="0" y="75" fill="#64748b" font-size="10" class="font">💡 *Draft* dapat diedit kapan saja sebelum diajukan ke Admin.</text>
      </g>
    </g>
  </g>
</svg>
