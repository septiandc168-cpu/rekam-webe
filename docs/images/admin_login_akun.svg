<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="100%">
  <defs>
    <style>
      .font { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .shadow { filter: drop-shadow(0px 8px 16px rgba(0,0,0,0.08)); }
    </style>
    <linearGradient id="navGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#001f3f" />
      <stop offset="100%" stop-color="#002d5b" />
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="900" height="480" fill="#f8fafc" rx="12" />

  <!-- Window Header -->
  <rect width="900" height="42" fill="#0f172a" rx="12" />
  <rect y="30" width="900" height="12" fill="#0f172a" />
  <circle cx="24" cy="21" r="6" fill="#ef4444" />
  <circle cx="44" cy="21" r="6" fill="#eab308" />
  <circle cx="64" cy="21" r="6" fill="#22c55e" />
  <rect x="180" y="10" width="540" height="22" rx="6" fill="#1e293b" />
  <text x="450" y="25" fill="#94a3b8" font-size="11" text-anchor="middle" class="font">rekamwebe.yayasanwebe.org/login</text>

  <!-- Container Grid -->
  <!-- LEFT: Form Login -->
  <g transform="translate(40, 70)" class="shadow">
    <rect width="380" height="370" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />
    <rect width="380" height="60" rx="10" fill="url(#navGrad)" />
    <rect y="50" width="380" height="10" fill="#001f3f" />
    <text x="190" y="38" fill="#ffffff" font-size="16" font-weight="bold" text-anchor="middle" class="font">Rekam WeBe • Login</text>
    
    <!-- Input Email -->
    <text x="35" y="105" fill="#475569" font-size="12" font-weight="600" class="font">Email</text>
    <rect x="35" y="115" width="310" height="36" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
    <text x="48" y="138" fill="#1e293b" font-size="13" class="font">admin@yayasanwebe.org</text>

    <!-- Input Password -->
    <text x="35" y="178" fill="#475569" font-size="12" font-weight="600" class="font">Password</text>
    <rect x="35" y="188" width="310" height="36" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
    <text x="48" y="212" fill="#64748b" font-size="16" class="font">••••••••••••</text>

    <!-- Remember Me -->
    <rect x="35" y="240" width="16" height="16" rx="4" fill="#001f3f" />
    <path d="M39 248 L43 252 L48 244" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round" />
    <text x="60" y="253" fill="#64748b" font-size="12" class="font">Ingat Saya</text>

    <!-- Button Login -->
    <rect x="35" y="275" width="310" height="40" rx="6" fill="#001f3f" />
    <text x="190" y="300" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle" class="font">Masuk ke Sistem</text>

    <text x="190" y="345" fill="#94a3b8" font-size="11" text-anchor="middle" class="font">Yayasan WeBe © 2026</text>
  </g>

  <!-- RIGHT: Modal Ganti Password -->
  <g transform="translate(480, 70)" class="shadow">
    <rect width="380" height="370" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />
    <rect width="380" height="50" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
    <text x="25" y="32" fill="#0f172a" font-size="15" font-weight="bold" class="font">Modal Ganti Password</text>
    <circle cx="350" cy="25" r="10" fill="#f1f5f9" />
    <text x="350" y="29" fill="#64748b" font-size="12" text-anchor="middle" font-weight="bold" class="font">✕</text>

    <!-- Input Lama -->
    <text x="30" y="85" fill="#475569" font-size="12" font-weight="600" class="font">Password Saat Ini</text>
    <rect x="30" y="95" width="320" height="34" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
    <text x="42" y="117" fill="#64748b" font-size="14" class="font">••••••••</text>

    <!-- Input Baru -->
    <text x="30" y="152" fill="#475569" font-size="12" font-weight="600" class="font">Password Baru (min. 8 karakter)</text>
    <rect x="30" y="162" width="320" height="34" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
    <text x="42" y="184" fill="#64748b" font-size="14" class="font">••••••••••••</text>

    <!-- Konfirmasi Baru -->
    <text x="30" y="219" fill="#475569" font-size="12" font-weight="600" class="font">Konfirmasi Password Baru</text>
    <rect x="30" y="229" width="320" height="34" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
    <text x="42" y="251" fill="#64748b" font-size="14" class="font">••••••••••••</text>

    <!-- Action Buttons -->
    <rect x="175" y="290" width="80" height="36" rx="6" fill="#e2e8f0" />
    <text x="215" y="313" fill="#475569" font-size="13" font-weight="600" text-anchor="middle" class="font">Batal</text>

    <rect x="265" y="290" width="85" height="36" rx="6" fill="#001f3f" />
    <text x="307" y="313" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle" class="font">Simpan</text>

    <!-- Note -->
    <rect x="30" y="340" width="320" height="1" fill="#e2e8f0" />
    <text x="190" y="358" fill="#0284c7" font-size="11" text-anchor="middle" class="font">💡 Akses menu ini lewat tombol profil di pojok kanan atas</text>
  </g>
</svg>
