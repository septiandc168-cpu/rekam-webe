<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 540" width="100%" height="100%">
  <defs>
    <style>
      .font { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .shadow-sm { filter: drop-shadow(0px 3px 6px rgba(0,0,0,0.06)); }
    </style>
  </defs>

  <rect width="940" height="540" fill="#f8fafc" rx="10" />

  <!-- Page Header -->
  <g transform="translate(35, 20)">
    <text x="0" y="24" fill="#0f172a" font-size="20" font-weight="bold" class="font">Pembuatan Laporan Kegiatan</text>
    <text x="0" y="44" fill="#64748b" font-size="12" class="font">Laporkan pertanggungjawaban kegiatan lapangan dengan melampirkan berkas bukti otentik</text>
  </g>

  <!-- 2 Jalur Pembuatan Laporan -->
  <g transform="translate(35, 80)" class="shadow-sm">
    <rect width="870" height="90" rx="8" fill="#ffffff" stroke="#e2e8f0" />
    <text x="20" y="25" fill="#0f172a" font-size="12" font-weight="bold" class="font">Dua Cara Memulai Laporan Kegiatan:</text>

    <!-- Jalur 1 -->
    <g transform="translate(20, 38)">
      <rect width="395" height="40" rx="6" fill="#eff6ff" stroke="#bfdbfe" />
      <text x="14" y="24" fill="#1e40af" font-size="11" font-weight="bold" class="font">1. Dari Rencana Disetujui (Rekomendasi Utama)</text>
      <text x="14" y="34" fill="#3b82f6" font-size="9" class="font">Klik tombol [Buat Laporan] pada tabel rencana yang siap dilaporkan</text>
    </g>

    <!-- Jalur 2 -->
    <g transform="translate(450, 38)">
      <rect width="395" height="40" rx="6" fill="#f8fafc" stroke="#cbd5e1" />
      <text x="14" y="24" fill="#334155" font-size="11" font-weight="bold" class="font">2. Laporan Langsung (Tanggap Darurat)</text>
      <text x="14" y="34" fill="#64748b" font-size="9" class="font">Klik tombol [+ Buat Laporan Langsung] untuk kegiatan insidental</text>
    </g>
  </g>

  <!-- WIZARD STEP & BUKTI LAMPIRAN (Langkah 3) -->
  <g transform="translate(35, 190)" class="shadow-sm">
    <rect width="870" height="325" rx="8" fill="#ffffff" stroke="#e2e8f0" />
    
    <!-- Wizard step mini bar -->
    <g transform="translate(40, 20)">
      <circle cx="20" cy="15" r="14" fill="#001f3f" />
      <text x="20" y="19" fill="#ffffff" font-size="10" font-weight="bold" text-anchor="middle" class="font">1</text>
      <text x="42" y="19" fill="#001f3f" font-size="12" font-weight="bold" class="font">Realisasi Pelaksanaan</text>
      
      <line x1="190" y1="15" x2="250" y2="15" stroke="#001f3f" stroke-width="2" />

      <circle cx="270" cy="15" r="14" fill="#001f3f" />
      <text x="270" y="19" fill="#ffffff" font-size="10" font-weight="bold" text-anchor="middle" class="font">2</text>
      <text x="292" y="19" fill="#001f3f" font-size="12" font-weight="bold" class="font">Evaluasi &amp; Output</text>

      <line x1="430" y1="15" x2="490" y2="15" stroke="#001f3f" stroke-width="2" />

      <circle cx="510" cy="15" r="14" fill="#001f3f" />
      <text x="510" y="19" fill="#ffffff" font-size="10" font-weight="bold" text-anchor="middle" class="font">3</text>
      <text x="532" y="19" fill="#001f3f" font-size="12" font-weight="bold" class="font">Unggah Berkas Bukti Lapangan</text>
    </g>

    <!-- Upload Grid Showcase (Langkah 3) -->
    <g transform="translate(40, 70)">
      <text x="0" y="0" fill="#0f172a" font-size="13" font-weight="bold" class="font">Langkah 3: Unggah Dokumen Bukti Otentik (Maks. 50MB per file):</text>

      <g transform="translate(0, 15)">
        <!-- 1. Foto -->
        <rect x="0" y="0" width="145" height="110" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="3,3" />
        <text x="72" y="45" font-size="22" text-anchor="middle">📷</text>
        <text x="72" y="70" fill="#0f172a" font-size="11" font-weight="bold" text-anchor="middle" class="font">Foto Kegiatan</text>
        <text x="72" y="85" fill="#64748b" font-size="9" text-anchor="middle" class="font">(Auto Kompres)</text>

        <!-- 2. Daftar Hadir -->
        <rect x="160" y="0" width="145" height="110" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="3,3" />
        <text x="232" y="45" font-size="22" text-anchor="middle">📋</text>
        <text x="232" y="70" fill="#0f172a" font-size="11" font-weight="bold" text-anchor="middle" class="font">Daftar Hadir</text>
        <text x="232" y="85" fill="#64748b" font-size="9" text-anchor="middle" class="font">(Bertanda tangan)</text>

        <!-- 3. Notulen -->
        <rect x="320" y="0" width="145" height="110" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="3,3" />
        <text x="392" y="45" font-size="22" text-anchor="middle">📝</text>
        <text x="392" y="70" fill="#0f172a" font-size="11" font-weight="bold" text-anchor="middle" class="font">Notulen Rapat</text>
        <text x="392" y="85" fill="#64748b" font-size="9" text-anchor="middle" class="font">(Ringkasan Acara)</text>

        <!-- 4. Materi -->
        <rect x="480" y="0" width="145" height="110" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="3,3" />
        <text x="552" y="45" font-size="22" text-anchor="middle">📚</text>
        <text x="552" y="70" fill="#0f172a" font-size="11" font-weight="bold" text-anchor="middle" class="font">Materi / Slide</text>
        <text x="552" y="85" fill="#64748b" font-size="9" text-anchor="middle" class="font">(PDF / PPT)</text>

        <!-- 5. Berita Acara -->
        <rect x="640" y="0" width="145" height="110" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="3,3" />
        <text x="712" y="45" font-size="22" text-anchor="middle">📜</text>
        <text x="712" y="70" fill="#0f172a" font-size="11" font-weight="bold" text-anchor="middle" class="font">Berita Acara</text>
        <text x="712" y="85" fill="#64748b" font-size="9" text-anchor="middle" class="font">(Dokumen Serah Terima)</text>
      </g>

      <!-- Bottom action button -->
      <g transform="translate(0, 150)">
        <rect width="180" height="40" rx="6" fill="#64748b" />
        <text x="90" y="25" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle" class="font">💾 Simpan Draft</text>

        <rect x="200" y="0" width="220" height="40" rx="6" fill="#001f3f" />
        <text x="310" y="25" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle" class="font">🚀 Ajukan Laporan ke Admin</text>
      </g>
    </g>
  </g>
</svg>
